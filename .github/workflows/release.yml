name: Release

# Publishes nitid to PyPI when a version tag is pushed, through a PyPI trusted
# publisher (no API token is stored in the repository). A manual run publishes
# to TestPyPI instead, as a dry run before the first real release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Verify wheel contents
        run: python scripts/verify_wheel.py dist/*.whl

      - name: Install the wheel into a clean environment
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl

      - name: Verify installed detection and segmentation APIs
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/scripts/verify_install.py"
          "$RUNNER_TEMP/venv/bin/nitid" --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nitid
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nitid
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
