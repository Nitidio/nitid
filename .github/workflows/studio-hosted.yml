name: Studio hosted (Cloudflare)

# Builds the hosted Nitid app (browser-only, no backend), runs the browser smoke test and, only when asked,
# deploys it to Cloudflare. Manual only: nothing here runs on push or pull request. Setup (account, API
# token, secrets, variable, domain) and rollback: docs/studio-hosted.md
#
# The ONNX models are NOT deployed to Cloudflare (static assets accept 25 MiB per file; nitid1s is larger).
# The owner hosts the model bundle on a server of his own (docs/studio-hosted-models.md). The "hosted-bundle"
# artifact of this workflow is only what he downloads and uploads there; the UI is built for its URL.
#
# Secrets the owner must create (Settings > Secrets and variables > Actions > Secrets), never in the repository:
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit" (add "Workers Routes/Zone: Edit" for a custom domain)
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
# Repository VARIABLE (Settings > Secrets and variables > Actions > Variables; not a secret, it is public):
#   STUDIO_MODELS_BASE_URL  absolute https base URL of the models server, e.g. https://models.nitid.io/
#                           Required for a deploy; the dry run falls back to the smoke test's own local setup.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloudflare after the checks pass. Leave off for a dry run (build, assemble, smoke test)."
        type: boolean
        default: false
  # Later, to publish on every release, uncomment (the deploy gate below must then be reconsidered):
  # release:
  #   types: [published]

permissions:
  contents: read

concurrency:
  group: studio-hosted
  cancel-in-progress: false

jobs:
  build-ui:
    name: Build the hosted UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm (version pinned in package.json)
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Check the frontend
        run: pnpm run check

      # The UI is built for the models server of the owner: vars.STUDIO_MODELS_BASE_URL (a repository
      # variable, not a secret). A deploy without it would publish an app with no models: refuse early.
      - name: Require the models URL for a deploy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
        env:
          STUDIO_MODELS_BASE_URL: ${{ vars.STUDIO_MODELS_BASE_URL }}
        run: |
          if [ -z "$STUDIO_MODELS_BASE_URL" ]; then
            echo "::error::The repository variable STUDIO_MODELS_BASE_URL is empty. Create it (Settings > Secrets and variables > Actions > Variables) with the https base URL of the models server, e.g. https://models.nitid.io/ (docs/studio-hosted.md), then run again."
            exit 1
          fi

      - name: Build the hosted UI
        env:
          STUDIO_MODELS_BASE_URL: ${{ vars.STUDIO_MODELS_BASE_URL }}
        run: pnpm run build:hosted

      - uses: actions/upload-artifact@v4
        with:
          name: hosted-ui
          path: studio/dist-hosted
          if-no-files-found: error
          retention-days: 7

  publish-bundle:
    name: Publish the model bundle
    runs-on: ubuntu-latest
    env:
      BUNDLE_DIR: ${{ github.workspace }}/bundle
    steps:
      - uses: actions/checkout@v7

      - name: Require the bundle tool
        run: |
          if [ ! -f tools/publish_models.py ]; then
            echo "::error::tools/publish_models.py is not on this branch yet (it lands in the studio/hosted-pipeline pull request)."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --extra train

      - name: Publish the bundle (models.json, ONNX files, SHA256SUMS, licences)
        # Default sizes (n, s). Not deployed to Cloudflare: an ARTIFACT for the owner to download and upload
        # to his models server (docs/studio-hosted-models.md).
        run: uv run python -m tools.publish_models --out "$BUNDLE_DIR"

      # Strict check of the bundle the owner will upload (needs onnx and jsonschema, installed above).
      - name: Check the bundle
        run: uv run python -m tools.check_hosted_bundle "$BUNDLE_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: hosted-bundle
          path: bundle
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble and smoke-test
    needs: [build-ui, publish-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: hosted-ui
          path: studio/dist-hosted

      - uses: actions/download-artifact@v4
        with:
          name: hosted-bundle
          path: bundle

      # Cross-origin mode: nothing of the bundle goes into the site; the CSP gets exactly the origin of
      # STUDIO_MODELS_BASE_URL, and the script checks that the UI was built for the same URL. Standard
      # library only. Without the variable (a dry run) there is nothing to deploy, so this step is skipped.
      - name: Assemble studio/dist-hosted-site
        if: ${{ vars.STUDIO_MODELS_BASE_URL != '' }}
        env:
          STUDIO_MODELS_BASE_URL: ${{ vars.STUDIO_MODELS_BASE_URL }}
        run: python scripts/assemble_hosted.py --models-base-url "$STUDIO_MODELS_BASE_URL" --validate-bundle bundle --bundle-check basic --clean

      - name: Note when the site is not assembled
        if: ${{ vars.STUDIO_MODELS_BASE_URL == '' }}
        run: |
          echo "::notice::The repository variable STUDIO_MODELS_BASE_URL is empty: dry run, no site assembled (a deploy needs it). The smoke test below builds its own."

      - name: Show what will be deployed
        if: ${{ vars.STUDIO_MODELS_BASE_URL != '' }}
        run: |
          find studio/dist-hosted-site -maxdepth 2 | sort
          du -sh studio/dist-hosted-site

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm (version pinned in package.json)
        run: corepack enable

      - name: Install the frontend dependencies
        working-directory: studio
        run: pnpm install --frozen-lockfile

      # playwright-core only drives the Chrome that the runner already has; no browser download.
      - name: Install playwright-core (outside the repository)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright-core
          echo "PLAYWRIGHT_CORE_PATH=$RUNNER_TEMP/pw/node_modules/playwright-core" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"

      # Real Chrome, the production headers, a fixture bundle and a second origin for it, with no backend:
      # the same-origin and the cross-origin topologies, plus negative cases (no CORS header, origin missing
      # from the CSP). Fails the run on any console error, CSP violation, /api/* request or loss of isolation.
      - name: Smoke test the hosted site
        working-directory: studio
        run: pnpm run smoke:hosted

      - uses: actions/upload-artifact@v4
        if: ${{ vars.STUDIO_MODELS_BASE_URL != '' }}
        with:
          name: hosted-site
          path: studio/dist-hosted-site
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to Cloudflare
    # Nothing deploys by accident: the run must be started by hand with "deploy" ticked.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    needs: assemble
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v7

      - name: Require the models URL
        env:
          STUDIO_MODELS_BASE_URL: ${{ vars.STUDIO_MODELS_BASE_URL }}
        run: |
          if [ -z "$STUDIO_MODELS_BASE_URL" ]; then
            echo "::error::The repository variable STUDIO_MODELS_BASE_URL is empty: the app would be deployed without models. Create it (docs/studio-hosted.md) and run again."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: hosted-site
          path: studio/dist-hosted-site

      # The config is studio/hosting/cloudflare/wrangler.jsonc (assets-only Worker "nitid-app").
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned: without it the action installs wrangler 3.90.0 (Nov 2024) when none is found, and the
          # first real deploy served the site WITHOUT the headers of _headers (no COOP/COEP/CSP).
          wranglerVersion: "4.166.0"
          command: deploy --config studio/hosting/cloudflare/wrangler.jsonc
