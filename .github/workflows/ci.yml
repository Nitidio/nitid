name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    name: Lint / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check lockfile
        run: uv lock --check

      - name: Run ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .


  test:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The studio extra makes the Studio tests run instead of skipping.
      - name: Install dependencies
        run: uv sync --extra dev --extra train --extra studio

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=dfine \
            --cov-report=xml \
            tests/unit tests/integration

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml

  mypy:
    name: Type Check / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra studio

      - name: Run mypy
        run: uv run mypy dfine/ nitid/ tools/ scripts/

  studio-ui:
    name: Studio UI (Node 22)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Corepack reads "packageManager" in studio/package.json and uses exactly that pnpm.
      - name: Enable pnpm (version pinned in package.json)
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lint, typecheck, unit tests and the production build (into nitid/studio/static)
      - name: Check the frontend
        run: pnpm run check

      - name: Check the frontend size policy
        run: pnpm run check:size

      - name: Require the built index.html
        working-directory: .
        run: test -f nitid/studio/static/index.html

      - name: Upload the built UI
        uses: actions/upload-artifact@v4
        with:
          name: studio-static
          path: nitid/studio/static
          if-no-files-found: error
          retention-days: 7

  # Real server + built UI + real Chrome (see docs/studio-e2e.md). Optional: it is not in any
  # `needs:` and may fail without blocking a merge; make it required once it has proven stable.
  studio-e2e:
    name: Studio end to end (Chrome)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm (version pinned in package.json)
        run: corepack enable

      - name: Install Python dependencies
        run: uv sync --extra dev --extra train --extra studio

      - name: Install the frontend dependencies
        working-directory: studio
        run: pnpm install --frozen-lockfile

      - name: Build the UI into nitid/studio/static
        run: uv run python scripts/build_studio.py

      # playwright-core only drives the Chrome that the runner already has; no browser download.
      - name: Install playwright-core (outside the repository)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright-core
          echo "PLAYWRIGHT_CORE_PATH=$RUNNER_TEMP/pw/node_modules/playwright-core" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Run the end-to-end tests
        run: uv run pytest studio/e2e -s -rs --no-header -p no:cacheprovider

  package:
    name: Installed wheel acceptance
    needs: studio-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The wheel must ship the UI, so it is built before `uv build` (see docs/studio-packaging.md).
      - name: Download the built UI
        uses: actions/download-artifact@v4
        with:
          name: studio-static
          path: nitid/studio/static

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the UI is in place
        run: python scripts/build_studio.py --check-only

      - name: Install test dependencies
        run: uv sync --extra dev --extra train --extra studio

      - name: Build distributions
        run: uv build

      - name: Verify wheel contents
        run: uv run python scripts/verify_wheel.py dist/*.whl

      - name: Replace editable install with wheel
        run: uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl

      - name: Verify installed detection and segmentation APIs
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/scripts/verify_install.py" --require-ui
          "$GITHUB_WORKSPACE/.venv/bin/dfine" --help

      - name: Verify the wheel in a slim container without libGL
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" python:3.12-slim bash -c '
            set -e
            pip install -q uv
            uv venv -q /venv
            wheel=$(ls /repo/dist/*.whl)
            uv pip install -q --python /venv/bin/python \
              --index-url https://download.pytorch.org/whl/cpu \
              --extra-index-url https://pypi.org/simple \
              "$wheel[studio]"
            cd /tmp && /venv/bin/python /repo/scripts/verify_install.py --require-ui
          '
