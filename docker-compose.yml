services:
  nitid-dev:
    image: nitid-env
    container_name: nitid_container

    volumes:
      # Bind-mounts your Mac project folder into /app inside the container.
      # .venv will be created HERE (on your Mac disk), bypassing Docker's virtual disk.
      - .:/app

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - UV_LINK_MODE=copy

    # Keep the container alive with an interactive shell.
    # You run 'uv sync --frozen' yourself once inside — so you can see all output.
    stdin_open: true
    tty: true
    restart: unless-stopped

  nitid-gstreamer:
    profiles: ["gstreamer"]
    build:
      context: .
      dockerfile: Dockerfile.gstreamer
    image: nitid-gstreamer
    container_name: nitid_gstreamer
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - HOME=/tmp/nitid-home
    group_add:
      - "${VIDEO_GID:-44}"
    healthcheck:
      test: ["CMD-SHELL", "dfine gstreamer-info | grep -q 'OpenCV GStreamer: yes'"]
      interval: 30s
      timeout: 10s
      retries: 3
    stdin_open: true
    tty: true
    restart: unless-stopped
