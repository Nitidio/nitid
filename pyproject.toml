[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dfine*", "tools*", "web*"]

[project]
name = "nitid"
version = "0.1.0"
description = "Ultralytics-style wrapper for the D-FINE object detector"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "onnx>=1.15",
    "onnxsim>=0.4",
    "tqdm>=4.66",
    "tensorboard>=2.14",  # required by extern/dfine src/core/_config.py
    "scipy>=1.10",        # required by extern/dfine HungarianMatcher (training)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
train = [
    "pycocotools>=2.0",
]
tensorrt = ["tensorrt>=8.6"]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "pydantic-settings>=2.0",
]

[project.scripts]
dfine = "tools.dfine_cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

# ── uv ────────────────────────────────────────────────────────────────────────

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

# ── ruff (linter) ─────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle, pyflakes, isort
ignore = ["E501"]                # line length handled by formatter

# ── mypy (type checking) ──────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true    # torch stubs are incomplete
strict = false                   # tighten gradually

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
