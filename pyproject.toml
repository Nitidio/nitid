[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dfine*", "nitid*"]

[project]
name = "nitid"
version = "0.1.0"
description = "Object detection, instance segmentation and semantic segmentation, Apache 2.0 code and weights"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "mss>=10.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "onnx>=1.15",
    "onnxscript>=0.1",
    # 0.6.2 has broken source metadata and no CPython 3.11 wheel.
    "onnxsim>=0.6.5,<0.7",
    "tqdm>=4.66",
    "tensorboard>=2.14",
    "scipy>=1.10",        # Hungarian matching during training
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pycocotools>=2.0",
    "ruff",
    "mypy",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pre-commit>=3.0",
    "types-PyYAML",
]
train = [
    "pycocotools>=2.0",
]

track = [
    "trackers>=2.5,<3",
]

openvino = [
    "openvino>=2024.0",
]

wandb = [
    "wandb>=0.17",
]

mlflow = [
    "mlflow>=2.14,<3",
]

[project.scripts]
nitid = "nitid.cli:main"
dfine = "nitid.cli:main"

[project.urls]
Homepage = "https://Vaelsys.github.io/nitid/"
Documentation = "https://Vaelsys.github.io/nitid/"
Issues = "https://github.com/Vaelsys/nitid/issues"
Repository = "https://github.com/Vaelsys/nitid"
Changelog = "https://github.com/Vaelsys/nitid/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "onnxruntime>=1.18,<1.24; python_version < '3.11'",
    "onnxruntime>=1.18; python_version >= '3.11'",
]

# ── uv ────────────────────────────────────────────────────────────────────────

[tool.uv]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu121", marker = "sys_platform == 'win32' and platform_machine == 'x86_64'" },
    { index = "pypi", marker = "sys_platform == 'darwin' or platform_machine != 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu121", marker = "sys_platform == 'win32' and platform_machine == 'x86_64'" },
    { index = "pypi", marker = "sys_platform == 'darwin' or platform_machine != 'x86_64'" },
]
# ── ruff (linter) ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle, pyflakes, isort
ignore = ["E501"]                # line length handled by formatter

# ── mypy (type checking) ──────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true    # torch stubs are incomplete
strict = false                   # tighten gradually

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
