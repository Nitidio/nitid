site_name: nitid
site_description: One library. DETR made simple. — Apache 2.0 code
repo_url: https://github.com/Nitidio/nitid

theme:
  name: material
  logo: assets/brand/nitid-mark.svg
  favicon: assets/brand/nitid-mark.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - content.code.copy
    - navigation.top

extra_css:
  - stylesheets/brand.css

markdown_extensions:
  - admonition
  - pymdownx.details

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Command Line: cli.md
  - Fine-tuning: fine_tuning.md
  - "Guide: CUDA and OpenVINO": training_cuda_openvino.md
  - Export: export.md
  - Deployment: deployment.md
  - API Reference: api_reference.md
  - Troubleshooting: troubleshooting.md
  - Project:
      - Roadmap: roadmap.md
      - Brand: brand.md
      - Decisions:
          - Overview: adr/index.md
          - "ADR-0002: Native DETRPose integration": adr/0002-native-detrpose-integration.md
          - "ADR-0003: Native RiO-DETR OBB integration": adr/0003-native-rio-detr-obb-integration.md
  - Contributing:
      - Onboarding: onboarding.md
      - macOS Docker Setup: macos_docker_setup.md
